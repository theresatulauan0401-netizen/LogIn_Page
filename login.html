<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Express - Login</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page">
    <header>
        <div class="top-nav">
            <div class="top-left">
                <a href="pages/contact.html">Contact</a>
            </div>
            <div class="top-right">
                <a href="pages/help.html">Help</a>
            </div>
        </div>
        <nav class="main-bar">
            <div class="logo">
                <img src="assets/images/javabus.jpg" alt="Java Express Logo">
                <span>Java Express</span>
            </div>
            <div class="main-nav">
                <a href="index.html">Home</a>
                <a href="pages/managebooking.html">Manage Booking</a>
                <a href="pages/help.html">Help</a>
                <a href="login.html" aria-current="page">Login</a>
                <a href="signup.html">Sign Up</a>
            </div>
        </nav>
    </header>

    <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
            <p class="login-eyebrow" id="login-eyebrow">WELCOME BACK</p>
            <h1 id="login-title">Log in to your account</h1>
            <p class="login-intro" id="login-intro">Access your bookings and travel details.</p>

            <form class="auth-form" id="login-form">
                <label for="email">Email or mobile number</label>
                <input
                    type="text"
                    id="email"
                    name="identifier"
                    placeholder="Enter your email or mobile number"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button class="show-password" type="button" id="show-password" aria-controls="password" aria-pressed="false">Show</button>
                </div>

                <div class="login-options">
                    <label class="remember-option" for="remember">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Keep me logged in</span>
                    </label>
                    <a href="pages/contact.html">Forgot password?</a>
                </div>

                <button class="login-button" type="submit">Log in</button>
                <p class="login-notice" id="login-notice" role="status" aria-live="polite"></p>

                <div class="login-divider"><span>OR</span></div>

                <div class="social-login">
                    <button class="social-button" type="button" data-provider="Google">
                        <span class="google-mark" aria-hidden="true">G</span>
                        Continue with Google
                    </button>
                    <button class="social-button" type="button" data-provider="Facebook">
                        <span class="facebook-mark" aria-hidden="true">f</span>
                        Continue with Facebook
                    </button>
                </div>

                <p class="signup-prompt">New Passenger? <a href="signup.html">Create an account</a></p>
            </form>

            <p class="login-help">Need help? <a href="pages/contact.html">Contact us</a></p>
        </section>
    </main>

    <script>
        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();
            document.getElementById("login-notice").textContent =
                "Login is not connected to an account service yet.";
        });

        const passwordInput = document.getElementById("password");
        const showPasswordButton = document.getElementById("show-password");
        showPasswordButton.addEventListener("click", function () {
            const shouldShowPassword = passwordInput.type === "password";
            passwordInput.type = shouldShowPassword ? "text" : "password";
            showPasswordButton.textContent = shouldShowPassword ? "Hide" : "Show";
            showPasswordButton.setAttribute("aria-pressed", String(shouldShowPassword));
        });

        document.querySelectorAll(".social-button").forEach(function (button) {
            button.addEventListener("click", function () {
                document.getElementById("login-notice").textContent =
                    button.dataset.provider + " login is not connected yet.";
            });
        });
    </script>
</body>
</html>
