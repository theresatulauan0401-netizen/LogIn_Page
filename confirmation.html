<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Express - Confirm Your Booking</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="../assets/js/confirmation.js" defer></script>
</head>
<body class="seat-page confirmation-page">
    <header>
        <div class="top-nav">
            <div class="top-left">
                <a href="contact.html">Contact</a>
                <a href="help.html">Help</a>
            </div>
            <div class="top-right">
                <a href="../index.html">Home</a>
            </div>
        </div>
        <nav class="main-bar" aria-label="Main navigation">
            <div class="logo">
                <img src="../assets/images/javabus.jpg" alt="">
                <span>Java Express</span>
            </div>
            <div class="main-nav">
                <a href="../index.html">Home</a>
                <a href="managebooking.html">Manage Booking</a>
                <a href="help.html">Help</a>
                <a href="../login.html">Login</a>
                <a href="../signup.html">Sign Up</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="confirmation-card" aria-labelledby="confirmation-title">
            <div class="confirmation-header">
                <p class="eyebrow">JAVA EXPRESS</p>
                <h1 id="confirmation-title">Confirm Your Booking</h1>
                <p class="confirmation-intro">Review your seats and passenger details before continuing.</p>
            </div>

            <p class="booking-error" id="booking-error" role="alert" hidden></p>

            <form id="confirmation-form">
                <section class="confirmation-section" aria-labelledby="passenger-details-title">
                    <h2 id="passenger-details-title">Passenger details</h2>
                    <div class="passenger-list" id="passenger-list">
                        <fieldset class="passenger-entry">
                            <legend>Passenger 1</legend>
                            <div class="passenger-fields">
                                <div class="confirmation-field full-name-field">
                                    <label for="passenger-name-1">Full name</label>
                                    <input id="passenger-name-1" name="passengerName[]" type="text"
                                        autocomplete="name" placeholder="Enter full name" required>
                                </div>
                                <div class="confirmation-field">
                                    <label for="passenger-email-1">Email</label>
                                    <input id="passenger-email-1" name="passengerEmail[]" type="email"
                                        autocomplete="email" placeholder="you@example.com" required>
                                </div>
                                <div class="confirmation-field">
                                    <label for="passenger-mobile-1">Mobile number</label>
                                    <input id="passenger-mobile-1" name="passengerMobile[]" type="tel"
                                        autocomplete="tel" placeholder="09XX XXX XXXX" required>
                                </div>
                            </div>
                        </fieldset>
                    </div>
                    <button class="add-passenger-button" id="add-passenger" type="button">+ Add passenger</button>
                </section>

                <section class="confirmation-section" aria-labelledby="payment-method-title">
                    <h2 id="payment-method-title">Payment method</h2>
                    <div class="payment-methods">
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="gcash" required>
                            <span>GCash</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="maya" required>
                            <span>Maya</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="card" required>
                            <span>Credit or Debit Card</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="terminal" required>
                            <span>Pay at terminal</span>
                        </label>
                    </div>
                </section>

                <p class="confirmation-summary" id="confirmation-summary" aria-live="polite"></p>
                <button class="booking-button primary confirmation-submit" type="submit">
                    Confirm booking <span id="confirmation-amount">₱0.00</span>
                </button>
                <p class="confirmation-message" id="confirmation-message" role="status" aria-live="polite"></p>
            </form>

            <a class="confirmation-back-link" href="busmap.html">Back to seat selection</a>
        </section>
    </main>
</body>
</html>
